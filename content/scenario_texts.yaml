D3_Q1: 'Вопрос 1: Были ли вопросы при оформлении?'
D3_Q1_b: Хорошо, я тебя понял! Помни, что ты всегда можешь связаться с рекрутером, описать проблему или задать интересующие тебя вопросы.
D3_Q1_c: Очень важно иметь возможность полноценно изучить подписываемые документы. Я буду благодарен, если ты поделишься с нами, почему у тебя не получилось этого сделать. В чем заключалась проблема?
D3_Q2: 'Вопрос 2: Как тебя встретили новые коллеги?'
D3_Q2_c: Жалко, что не удалось познакомиться с новыми коллегами. Скорее всего, ты вышел на работу в период большой нагрузки, такое бывает. Но если тебе кажется, что что-то пошло не так, то не бойся поднять этот вопрос со своим руководителем или написать моим коллегам в HR. Мы всегда готовы помочь.
D3_Q3: 'Вопрос 3: Понятны ли тебе задачи на испытательный срок?'
D3_Q3_a: Отлично 💪🏻
D3_Q3_b: Хорошо. Если в ближайшее время ты не получишь разъяснения по своим задачам, то лучше всего будет напрямую обсудить этот вопрос с руководителем. Также помни, что ты всегда можешь связаться с рекрутером, описать проблему или задать интересующие тебя вопросы. Мы всегда готовы помочь.
D3_Q3_c: Понимание своих задач на испытательном сроке - ключевой элемент его успешного прохождения. Если у тебя нет четкого представления, в чем будет заключаться твоя работа на ближайшие три месяца, то лучше всего обсудить этот вопрос с руководителем. Если недопонимание так и не прояснилось после общения с руководителем, то ты всегда можешь написать моим коллегам в отдел подбора персонала.
