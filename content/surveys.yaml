day3:
  point: "День 3"
  completion_text_id: D3_end
  questions:
    - id: paperwork
      text_id: D3_Q1
      type: single
      options: ["А) Все отлично!", "Б) Остались вопросы", "В) Возникли трудности с документами"]
      followups:
        1: {text_id: D3_Q1_b, help: contact}
        2: {text_id: D3_Q1_c, help: both}
    - id: colleagues
      text_id: D3_Q2
      type: single
      options: ["А) Отлично!", "Б) Пока присматриваюсь", "В) Никак, все заняты"]
      followups:
        2: {text_id: D3_Q2_c, help: both}
    - id: tasks
      text_id: D3_Q3
      type: single
      options: ["А) Да, все понятно!", "Б) Жду разъяснений от руководителя", "В) Пока ничего не понял"]
      followups:
        0: {text_id: D3_Q3_a}
        1: {text_id: D3_Q3_b, help: contact}
        2: {text_id: D3_Q3_c, help: both}
2weeks:
