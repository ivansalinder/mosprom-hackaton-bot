D10_1: 'Привет, {name}!


  Сегодня я хотел бы рассказать тебе об еще одном аспекте работы в нашей компании.'
D10_2: 'Как мы проводим корпоративные мероприятия? ✨🎊


  Наши корпоративные мероприятия - это не только возможность для сотрудников отдохнуть и развлечься, но и важная часть культуры компании. Мы стремимся создать дружелюбную и поддерживающую атмосферу, где каждый сотрудник будет чувствовать себя частью нашей большой команды.


  Формат праздников варьируется от традиционных корпоративов до игровых мероприятий, таких как спортивные соревнования, профессиональные и календарные праздники.'
D10_3: А вот пара фотографий с мероприятий
D10_4: Мы надеемся, что ты присоединишься к нам на ближайших мероприятиях и насладишься дружелюбной и позитивной атмосферой!
W2_intro: 'Привет, {name}!


  Хотел узнать, как у тебя дела? Нужна ли помощь с чем-то?'
W2_Q1: 1. Вам понятны поставленные задачи? (да/нет)
W2_Q2: 2. Вам достаточно информации для качественного выполнения вашей работы (да/нет)
W2_Q3: 3. Насколько доступен ваш руководитель для вопросов и обратной связи? (шкала 1 - недоступен, 10 - всегда доступен)
W2_Q4: 4. Оцените качество обратной связи от руководителя. (шкала 1 - отсутствует, 10 – исчерпывающая)
W2_Q5: 5. Насколько ваши коллеги оказывают поддержку при появлении вопросов или сложностей в работе (Шкала 1 - нет взаимодействия, 10 - отличное взаимодействие)
W2_Q6: 6. Оцените уровень поддержки по вопросам связанным с настройкой и предоставлением доступов/техники/рабочего пространства. (шкала 1 - низкий, 10 – высокий)
