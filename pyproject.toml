[project]
name = "korsik-max-assistant"
version = "0.2.0"
description = "ИИ-ассистент в мессенджере МАКС для адаптации персонала Группы ПОЛИПЛАСТИК"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "apscheduler>=3.10.4",
    "aiosqlite>=0.20.0",
    "openai>=1.50.0",
    "numpy>=1.26.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.12",
    "maxapi",
    "PyYAML>=6.0.2",
    "python-dateutil>=2.8.2",
]

[tool.uv.sources]
maxapi = { path = "../maxapi" }

[tool.setuptools]
packages = ["monitor"]