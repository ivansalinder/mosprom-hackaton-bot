# D1+1month+2weeks: напоминание и фильмы
m15:
  reminder: |
    Привет, {name}!

    Небольшое напоминание: через 2-3 дня у тебя будет встреча с менеджером по подбору персонала для обсуждения продвижения по адаптационному плану. Все детали тебе пришлет закрепленный за тобой Сотрудник Отдела по подбору и адаптации персонала. 🙂
  films: |
    А еще я собрал для тебя подборку фильмов, которые, возможно, тебе будет интересно посмотреть на выходных (подсказка: они связаны с выходом на новую работу!)

    1. «Дьявол носит Prada» (The Devil Wears Prada, 2006) 👠
    Энди — главная героиня фильма — устраивается в модный журнал на должность младшей ассистентки главного редактора, Миранды Пристли. С каждым днем ей приходится выполнять все более немыслимые задачи жесткой начальницы, проверять себя, чтобы понять, чего она хочет на самом деле.

    2. «Стажёр» (The Intern, 2015) 👨🏻‍🦳
    Главный герой, пенсионер Бен Уитакер, не побоялся в 70 лет стать стажером в крупном онлайн-магазине одежды. Он задает много вопросов, вникает в профессию и получает наслаждение от новой работы. Теплый и душевный фильм о том, что возраст для новых знаний не препятствие.

    3. В погоне за счастьем (The Pursuit of Happyness, 2006) 👨‍👦
    Отец-одиночка, Крис Гарднер, оказавшись в сложном финансовом положении, устраивается стажером в брокерскую компанию, рассчитывая получить должность специалиста. Только на протяжении стажировки он не будет получать никаких денег.

    4. Мне бы в небо (Up in the Air, 2009) ✈️
    Фильм о жизни корпоративного юриста Райана Бингэма. Его работа заключается в том, чтобы сообщать сотрудникам из разных организаций неприятную новость, что они… уволены. Главный герой - живое воплощение успеха, о котором многие мечтают, но цена такого образа весьма высока.

    5. Я не знаю, как она делает это — комедия о работающей в консалтинговой компании маме с двумя маленькими детьми и желанием быть хорошим специалистом, мамой, женой. С хорошей щепоткой юмора.

# D1+1month+3weeks: опрос 2 месяца
m17:
  msg1: "Привет!"
  msg2: "Мы подготовили небольшой опрос, чтобы ты смог поделиться с нами своими впечатлениями после двух месяцев работы."
  q1: "1) С каким настроением ты ежедневно приходишь на работу?"
  q2: "2) Кто тебе помогает в период испытательного срока? (несколько вариантов ответа)"
  q3: "3) Что помогло бы ускорить твою адаптацию?"
  thanks: "Спасибо за обратную связь!"
  A1_b: |
    Очень жаль, что работа не приносит тебе удовольствие. Если я и мои коллеги могу помочь тебе чем-то, направь вопрос в отдел подбора персонала. Мы вместе постараемся придумать решение и сделать твою жизнь на работе комфортнее.
  A1_c: |
    Мы все иногда можем сталкиваться с большим объемом работы, короткими сроками или слишком высокими ожиданиями со стороны руководства и коллег. Все это может создать большое давление и привести к отрицательным последствиям для физического и эмоционального здоровья. 😞

    Состояние эмоционального напряжения не является нормой, и в таком случае я бы рекомендовал обратиться в отдел подбора персонала: описать свою проблему, чтобы мы вместе придумали, как исправить ситуацию и сделать твою жизнь на работе комфортнее.
  A2_d: |
    Поддержка - важная составляющая успешной адаптации. Я всегда готов помочь тебе! Но какие-то вопросы слишком сложные, чтобы я мог решить их самостоятельно. В таких случаях ты всегда можешь обратиться за помощью к рекрутеру.

