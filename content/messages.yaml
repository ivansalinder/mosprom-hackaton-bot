# D1+10: корпоративные мероприятия
d10:
  msg1: |
    Привет, {name}!

    Сегодня я хотел бы рассказать тебе об еще одном аспекте работы в нашей компании.
  msg2: |
    Как мы проводим корпоративные мероприятия? ✨🎊

    Наши корпоративные мероприятия - это не только возможность для сотрудников отдохнуть и развлечься, но и важная часть культуры компании. Мы стремимся создать дружелюбную и поддерживающую атмосферу, где каждый сотрудник будет чувствовать себя частью нашей большой команды.

    Формат праздников варьируется от традиционных корпоративов до игровых мероприятий, таких как спортивные соревнования, профессиональные и календарные праздники.
  msg3: "А вот пара фотографий с мероприятий"
  msg4: "Мы надеемся, что ты присоединишься к нам на ближайших мероприятиях и насладишься дружелюбной и позитивной атмосферой!"

