# Общие тексты помощи и кнопок
help:
  relay_prompt: "Опиши, пожалуйста, что случилось, одним сообщением. Я передам это коллегам из отдела подбора персонала."
  relay_done: "Передал! Коллеги из отдела подбора персонала свяжутся с тобой. Обычно ответ приходит в течение {sla_hours} ч."
  contact_link: "Вот прямая ссылка на рекрутера: {recruiter_url}"
  contact_stub: "[TODO: ссылка на диалог с рекрутером]. Пока можно написать мне команду /HR, и я передам сообщение."
  reason_prompt: "Расскажи, пожалуйста, что именно пошло не так? Напиши причину одним сообщением. Если не хочешь, нажми «Пропустить»."
  reason_thanks: "Спасибо, что поделился. Я передам это коллегам."
  expect_text_hint: "Напиши, пожалуйста, ответ обычным сообщением или нажми «Пропустить»."

# Свободный вопрос вне сценария
free_question: "Какие-то вопросы слишком сложные, чтобы я мог решить их самостоятельно. Я посоветуюсь с коллегами из подбора персонала и вернусь с ответом!"

# Напоминание об опросе
survey_reminder: |
  Привет, {name}!

  Пишу с небольшим напоминанием, что ты не прошел опрос.

  Пожалуйста, не забудь это сделать в ближайшее время.

  P.S.: Он займет всего 1-2 минуты!

# Привязка по кодовому слову
bind:
  ask_code: "Привет! Я Корсик 🐾 Чтобы мы познакомились, пришли мне кодовое слово из твоего приглашения. Для теста можно использовать: яблоко, груша, слива, лимон, вишня или персик."
  wrong_code: "Не нашёл такое слово. Проверь, пожалуйста, и пришли ещё раз."
  confirm: "Это ты, {full_name}? Нажми «Да», если всё верно."

